steps:
  # 1. Build container image using Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/mcp-collector:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/mcp-collector:latest', '.']

  # 2. Push container image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mcp-collector:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/mcp-collector:latest']

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mcp-collector'
      - '--image'
      - 'gcr.io/$PROJECT_ID/mcp-collector:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '1'
      - '--session-affinity'

images:
  - 'gcr.io/$PROJECT_ID/mcp-collector:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/mcp-collector:latest'
